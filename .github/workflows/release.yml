name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run integration checks
        shell: pwsh
        run: dotnet run --project .\tests\LanDevLink.IntegrationChecks\LanDevLink.IntegrationChecks.csproj -c Release

      - name: Publish Windows x64
        shell: pwsh
        run: >-
          dotnet publish .\src\LanDevLink\LanDevLink.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o .\artifacts\win-x64

      - name: Package release
        shell: pwsh
        run: Compress-Archive -Path .\artifacts\win-x64\* -DestinationPath "LanDevLink-${{ github.ref_name }}-win-x64.zip"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $asset = "LanDevLink-$tag-win-x64.zip"

          if (gh release view $tag 2>$null) {
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset --verify-tag --generate-notes --title "LanDevLink $tag"
          }
